name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test ZapretManager.sln -c Release

      # Single-file publish ломается иначе, чем обычная сборка — прогоняем на каждый push,
      # чтобы не узнавать о поломке в момент релиза.
      - name: Build single-file exe
        shell: pwsh
        run: ./tools/publish.ps1
